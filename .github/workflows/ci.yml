name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Smoke run of the full pipeline
        run: |
          python run.py --quick --out smoke
          python report.py --results smoke
          test -s smoke/REPORT.md
      - name: Build the results explorer from the committed results
        run: |
          python site/build_site.py
          test -s docs/index.html
